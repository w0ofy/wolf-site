[build.environment]
  # Netlify defaults to a very old Node when nothing pins it, which breaks
  # both Next 16 and Corepack. Node 20 matches local development.
  NODE_VERSION = "20"
  # package.json sets "packageManager": "yarn@4.18.0", which Corepack needs
  # to honour. Netlify only ships Yarn 1 unless this is set explicitly.
  YARN_VERSION = "4.18.0"
